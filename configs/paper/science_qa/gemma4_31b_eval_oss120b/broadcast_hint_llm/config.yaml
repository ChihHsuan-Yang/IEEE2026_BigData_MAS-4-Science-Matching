  max_retry: 10
  max_public_context_tokens: 2400
  max_private_context_tokens: 600
  max_speak_history_context_tokens: 600
  max_advice_context_tokens: 2400
  max_candidate_context_tokens: 300
  max_manual_prompt_tokens: 12000
  memory:
    memory_type: chat_history
  llm:
    llm_type: gpt-3.5-turbo
    model: google/gemma-4-31B-it
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: dummy
  group_description: scientific reasoning broadcast-deliberation group
  answer_format_guidance: Final answers in this run must be boxed. Use option letters when the task is multiple-choice (including
    multi-letter answers such as \boxed{ABD}); otherwise use the requested numeric, symbolic, or short textual answer.
  intent_language_guidance: using concise scientific reasoning
  review_focus_guidance: Check whether the candidate follows the requested answer format, option mapping, units, and scientific
    reasoning.
  review_feedback_guidance: a concise scientific review explaining why you accept the answer or what needs repair
  final_answer_guidance: your best boxed answer, e.g. \boxed{A}, \boxed{ABD}, \boxed{50.7 atm}, or \boxed{x=2}
- agent_type: deliberator
  name: Talia
  role_description: Synthesis-oriented scientific peer; consolidate the strongest reasoning into one final answer.
  prepend_prompt_template:
    prompt_ref: deliberator_prepend_prompt
  append_prompt_template:
    prompt_ref: deliberator_append_prompt
