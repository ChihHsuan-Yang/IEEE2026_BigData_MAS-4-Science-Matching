max_rounds: 1
name: science-qa-baseline_llm
environment:
  env_type: task-single-llm-benchmark
  max_rounds: 1
  rule:
    reviewer_feedback_mode: plain
    evaluator:
      type: llm
      data_name: science-qa
      generic_failure_hint: The submitted answer was judged incorrect. Re-check the requested answer format, the option-letter
        mapping if choices are present, numeric units if relevant, and the scientific reasoning. Do not repeat a rejected
        answer unless the prior issue was only formatting.
agents:
- agent_type: solver
  name: Solo
  role_description: LLM-only scientific reasoning solver
  prepend_prompt_template:
    prompt_ref: solver_prepend_prompt
  append_prompt_template:
    prompt_ref: solver_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
  llm:
    llm_type: gpt-3.5-turbo
    model: google/gemma-4-31B-it
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: dummy
- agent_type: evaluator
  name: Evaluator
  role_description: Constrained scientific-answer evaluator
  prepend_prompt_template:
    prompt_ref: evaluator_prepend_prompt
  append_prompt_template:
    prompt_ref: evaluator_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
  llm:
    llm_type: gpt-3.5-turbo
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: mgsm-evaluator
    dimensions:
    - Correctness
prompt_preset:
  path: configs/paper/prompt_presets/science_qa/baseline_llm.yaml
