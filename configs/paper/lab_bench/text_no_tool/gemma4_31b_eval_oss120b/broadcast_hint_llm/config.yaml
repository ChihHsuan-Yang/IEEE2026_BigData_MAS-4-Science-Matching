    llm_type: gpt-3.5-turbo
    model: google/gemma-4-31B-it
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: dummy
  group_description: biology multiple-choice LAB-Bench deliberation group
  answer_format_guidance: LAB-Bench answers in this run must be exactly one listed multiple-choice option letter in boxed
    form, for example \boxed{A}.
  intent_language_guidance: using concise evidence-based biology reasoning
  review_focus_guidance: Reason carefully about whether the selected letter follows from the prompt evidence and matches the
    option text.
  review_feedback_guidance: a concise evidence-based review explaining why you accept the option letter or what is unsupported/wrong
  final_answer_guidance: your best boxed listed option-letter answer, for example \boxed{A}
- agent_type: evaluator
  name: Evaluator
  role_description: Constrained LAB-Bench multiple-choice evaluator
  prepend_prompt_template:
    prompt_ref: evaluator_prepend_prompt
  append_prompt_template:
    prompt_ref: evaluator_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
  llm:
    llm_type: gpt-3.5-turbo
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: mgsm-evaluator
    dimensions:
    - Correctness
prompt_preset:
  path: configs/paper/prompt_presets/lab_bench_mc/broadcast_hint_llm.yaml
