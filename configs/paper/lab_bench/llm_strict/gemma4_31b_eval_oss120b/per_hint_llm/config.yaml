max_rounds: 3
inner_rounds: 2
name: lab-bench-per_hint_llm
environment:
  env_type: task-per
  max_rounds: 3
  rule:
    inner_rounds: 2
    stop_on_agree: true
    reviewer_feedback_mode: hint
    failed_attempt_memory_limit: 3
    candidate_revision_memory_limit: 5
    evaluator:
      type: llm
      data_name: lab-bench
      generic_failure_hint: The selected option was judged incorrect. Re-check the question wording, the in-prompt evidence,
        and the option-letter mapping. Do not repeat a rejected letter unless the previous issue was only formatting.
agents:
- agent_type: solver
  name: Planner
  role_description: Planner who identifies the relevant biology evidence and option constraints
  prepend_prompt_template:
    prompt_ref: solver_prepend_prompt
  append_prompt_template:
    prompt_ref: solver_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
    has_summary: true
    max_summary_tlength: 300
    summary_model: google/gemma-4-31B-it
    summary_update_every_n_messages: 3
    summary_keep_last_n_messages: 0
    summary_keep_recent_token_budget: 200
  llm:
    llm_type: gpt-3.5-turbo
    model: google/gemma-4-31B-it
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: mgsm
- agent_type: executor
  name: Executor
  role_description: Executor who selects one option letter from the plan and prompt evidence
  prepend_prompt_template:
    prompt_ref: executor_prepend_prompt
  append_prompt_template:
    prompt_ref: executor_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
  llm:
    llm_type: gpt-3.5-turbo
    model: google/gemma-4-31B-it
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: mgsm
- agent_type: critic
  name: Reviewer
  role_description: Reviewer who checks whether the selected option letter is justified before submission
  prepend_prompt_template:
    prompt_ref: critic_prepend_prompt
  append_prompt_template:
    prompt_ref: critic_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
    has_summary: true
    max_summary_tlength: 300
    summary_model: google/gemma-4-31B-it
    summary_update_every_n_messages: 3
    summary_keep_last_n_messages: 0
    summary_keep_recent_token_budget: 200
  llm:
    llm_type: gpt-3.5-turbo
    model: google/gemma-4-31B-it
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: mgsm-critic-route
- agent_type: evaluator
  name: Evaluator
  role_description: Constrained LAB-Bench multiple-choice evaluator
  prepend_prompt_template:
    prompt_ref: evaluator_prepend_prompt
  append_prompt_template:
    prompt_ref: evaluator_append_prompt
  max_retry: 10
  memory:
    memory_type: chat_history
  llm:
    llm_type: gpt-3.5-turbo
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 1024
  output_parser:
    type: mgsm-evaluator
    dimensions:
    - Correctness
prompt_preset:
  path: configs/paper/prompt_presets/lab_bench_mc/per_hint_llm.yaml
