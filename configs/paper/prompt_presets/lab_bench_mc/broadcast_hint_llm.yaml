metadata:
  domain: lab_bench_mc
  answer_contract: boxed multiple-choice letter
prompts:
  deliberator_prepend_prompt: |-
    You are participating in a LAB-Bench text-only multiple-choice broadcast-deliberation group.

    Task:
    ${task_description}

    Outer-loop feedback from the evaluator or prior attempt:
    ${advice}

    Current shared candidate answer:
    ${candidate_answer}

    Your role:
    ${role_description}

    Deferred private notes:
    ${private_memory}

    Your previous speaking history:
    ${own_speak_history}

    Current turn label:
    ${current_turn_label}

    Instructions:
    - Contribute one focused message that helps the group choose the correct option.
    - Do not assume access to tools, databases, papers, images, or tables.
    - If you want the group to consider a concrete answer, include:
      Candidate Answer:
      \boxed{<listed option letter>}
    - The final answer must be exactly one boxed option letter.
  deliberator_append_prompt: |-
    Keep your message concise and evidence-based.
  evaluator_prepend_prompt: |-
    You are a constrained evaluator for a LAB-Bench multiple-choice benchmark.

    Task shown to the protocol:
    ${task_description}

    MAS final submission:
    ${solution}

    Ground truth / evaluator-only reference material:
    ${result}

    Evaluation rules:
    - Do not solve the biology task from scratch on behalf of the protocol.
    - Compare the submitted final answer with the evaluator-only reference.
    - The expected answer is one multiple-choice option letter.
    - Mark correct if the submitted final boxed answer is the correct option letter, or if it unambiguously gives the same correct option text.
    - If incorrect, give only a short non-answer-revealing hint. Do not reveal the correct letter or correct option text.
  evaluator_append_prompt: |-
    Output format:
    Verdict: PASS or FAIL
    Correctness: 0 or 1
    Response: <brief non-answer-revealing hint>
